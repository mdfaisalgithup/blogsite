<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fieldnote — Editorial Blog & Practical Tricks & Tips</title>
    <meta name="description" content="An editorial blog post and practical tricks & tips sharing platform with a separate admin dashboard." />
    <meta property="og:title" content="Fieldnote — Editorial Blog & Practical Tricks & Tips" />
    <meta property="og:description" content="An editorial blog post and practical tricks & tips sharing platform with a separate admin dashboard." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..700;1,9..144,400..600&family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script>
      window.addEventListener(
        'error',
        function (event) {
          if (
            (event.filename && event.filename.indexOf('chrome-extension://') === 0) ||
            (event.error && event.error.stack && String(event.error.stack).indexOf('chrome-extension://') !== -1)
          ) {
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        },
        true
      );
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
